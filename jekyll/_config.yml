title: IUEM
description: AI가 만든 노래를 부르면, AI가 채점하고 다음 곡을 골라 주는 음악 챌린지 — 개발 기록
lang: ko
theme: just-the-docs
color_scheme: dark

url: ""
baseurl: ""

search_enabled: true
search:
  heading_level: 3
  button: true

heading_anchors: true
back_to_top: true
back_to_top_text: "맨 위로"

aux_links:
  "서비스 바로가기": "https://woojeongalex.cloud"
  "GitHub": "https://github.com/woojeongalex/woojeongalex.cloud"
aux_links_new_tab: true

footer_content: "woojeongalex © 2026 — IUEM"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts/
  - vendor/

# 레이아웃을 적지 않은 페이지도 테마를 입는다. 없으면 홈만 테마가 입혀지고
# 나머지 페이지는 스타일 없는 HTML 로 나온다.
defaults:
  - scope:
      path: ""
    values:
      layout: default
