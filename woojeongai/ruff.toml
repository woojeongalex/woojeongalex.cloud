# ruff 설정 — 최소한만 둔다.
#
# 설정이 없으면 ruff 가 apps/ 하위 패키지를 서드파티로 오인해서, import 정렬이
# `sqlalchemy` 를 `music_challenge` 뒤로 보내는 등 저장소 관례를 깨뜨린다.
# (CLAUDE.md 의 하네스가 `ruff check . --fix` 를 강제하므로 실제로 코드가 망가진다.)
#
# sys.path 에 backend/ 와 backend/apps/ 가 모두 들어가므로(alembic/env.py 참고)
# apps 하위 패키지들은 최상위 이름으로 임포트된다 → 전부 1st party 로 선언한다.

[lint.isort]
known-first-party = [
    "adapters",
    "agora",
    "auth",
    "avengers",
    "core",
    "database",
    "doro",
    "friday13th",
    "justice_league",
    "music",
    "music_challenge",
    "silicon_valley",
    "soccer",
    "star_craft",
    "titanic",
]
