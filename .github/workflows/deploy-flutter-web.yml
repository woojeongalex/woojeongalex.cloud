name: Deploy Flutter Web to EC2

on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/deploy-flutter-web.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter Web
        working-directory: flutter
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}

      - name: Deploy to EC2
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          REMOTE_USER: ec2-user
          SOURCE: flutter/build/web/
          TARGET: /home/ec2-user/flutter-web-dist/

      - name: Restart nginx container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker cp /home/ec2-user/flutter-web-dist/. flutter_web:/usr/share/nginx/html/
            docker exec flutter_web nginx -s reload
