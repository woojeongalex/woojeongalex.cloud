# 로컬 개발용 오버라이드.
#
#   docker compose -f docker-compose.yaml -f docker-compose.local.yml up -d pgvector backend
#
# 루트 docker-compose.yaml 의 backend 는 포트를 공개하지 않는다(운영에서는
# cloudflared 를 통해서만 노출). 로컬에서는 브라우저·프론트엔드가 직접
# 붙어야 하므로 8000 을 공개한다.
#
# backend 는 ./woojeongai 를 바인드 마운트하므로 코드 수정은 재빌드 없이
# uvicorn reload 로 바로 반영된다.
services:
  backend:
    ports:
      - "8000:8000"
